services:
  # =============================================================
  # 1. TRACE-X FASTAPI BACKEND WEB SERVICE
  # =============================================================
  - type: web
    name: tracex-backend
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ACTIVE_MODEL
        value: gradient_boosting
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # =============================================================
  # 2. TRACE-X REACT + VITE FRONTEND (STATIC SITE)
  # =============================================================
  - type: static
    name: tracex-frontend
    region: oregon
    plan: free
    branch: master
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tracex-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tracex-backend
          envVarKey: RENDER_EXTERNAL_URL

